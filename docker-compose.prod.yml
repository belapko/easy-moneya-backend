services:
  db:
    image: postgres:18-alpine
    container_name: easy-moneya-postgres-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: node:24-alpine
    container_name: easy-moneya-backend-prod
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    ports:
      - "8080:8080"
    volumes:
      - ./:/app:ro
      - backend_prod_node_modules:/app/node_modules
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm start"

volumes:
  postgres_prod_data:
  backend_prod_node_modules:
